# MEATZE Campus — nginx reverse proxy (container).
# TLS is intentionally NOT configured here: terminate TLS on the target server
# (Certbot / external LB) and forward to this container's :80, or add a 443
# server block with mounted certs. Set X-Forwarded-Proto so Django treats it
# as HTTPS (SECURE_PROXY_SSL_HEADER).

upstream meatze_web { server web:8000; }
upstream meatze_ws  { server ws:8011; }

server {
    listen 80;
    server_name _;

    client_max_body_size 8g;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

    # Collected static files (from the `staticfiles` volume)
    location /static/ {
        alias /srv/staticfiles/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # User media (from the `media` volume)
    location /files/ {
        alias /srv/files/;
        access_log off;
        expires 7d;
    }

    # WebSocket (Daphne / channels)
    location /ws/ {
        proxy_pass http://meatze_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # Everything else -> Django (Gunicorn/WSGI)
    location / {
        proxy_pass http://meatze_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
